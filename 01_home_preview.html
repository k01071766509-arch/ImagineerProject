<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쉼결 - 홈</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #d8eeee;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh;
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    }
    .phone {
      width: 390px; min-height: 844px;
      background: #F0FAFA;
      border-radius: 44px;
      border: 2px solid #C8E8E8;
      padding: 52px 24px 20px;
      display: flex; flex-direction: column;
      position: relative; overflow: hidden;
      box-shadow: 0 20px 60px rgba(46,139,138,0.15);
    }
    .statusbar {
      display: flex; justify-content: space-between;
      font-size: 12px; color: #5A8A89;
      margin-bottom: 20px;
    }
    .toprow {
      display: flex; justify-content: space-between;
      align-items: flex-start; margin-bottom: 28px;
    }
    .greet-sub {
      font-size: 11px; color: #5BBFBE;
      letter-spacing: 0.12em; margin-bottom: 5px;
    }
    .greet-main {
      font-size: 26px; font-weight: 500;
      color: #1A3A3A; line-height: 1.35;
    }
    .notif-btn {
      width: 44px; height: 44px; border-radius: 50%;
      background: #E0F4F4; border: 0.5px solid #A8D8D8;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
      transition: background 0.2s;
    }
    .notif-btn:hover { background: #C8E8E8; }
    .notif-btn:active { transform: scale(0.95); }

    .mic-card {
      width: 100%; background: #E0F4F4;
      border: 0.5px solid #A8D8D8; border-radius: 24px;
      padding: 36px 24px 28px;
      display: flex; flex-direction: column; align-items: center;
      margin-bottom: 16px; cursor: pointer;
      transition: all 0.2s; position: relative; overflow: hidden;
    }
    .mic-card:hover { background: #D4EEF0; border-color: #5BBFBE; }
    .mic-card:active { transform: scale(0.98); }
    .mic-outer {
      width: 110px; height: 110px; border-radius: 50%;
      background: #F0FAFA; border: 2px solid #5BBFBE;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 18px;
      transition: border-color 0.2s;
    }
    .mic-card:hover .mic-outer { border-color: #2E8B8A; }
    .mic-inner {
      width: 86px; height: 86px; border-radius: 50%;
      background: #2E8B8A;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .mic-card:hover .mic-inner { background: #1a6e6d; }
    .mic-main-text {
      font-size: 16px; font-weight: 500; color: #1A3A3A;
      text-align: center; margin-bottom: 6px;
    }
    .mic-sub-text {
      font-size: 13px; color: #5A8A89; text-align: center;
      margin-bottom: 14px;
    }
    .tap-hint {
      font-size: 12px; color: #5BBFBE;
      padding: 5px 16px; border-radius: 20px;
      border: 0.5px solid #5BBFBE;
      background: #F0FAFA; letter-spacing: 0.05em;
    }

    .aquarium-banner {
      width: 100%; background: #fff;
      border: 0.5px solid #A8C8E8; border-radius: 18px;
      padding: 14px 16px;
      display: flex; align-items: center; gap: 14px;
      cursor: pointer; transition: all 0.2s;
      margin-bottom: auto;
    }
    .aquarium-banner:hover { background: #EAF4FB; border-color: #378ADD; }
    .aquarium-banner:active { transform: scale(0.98); }
    .fish-icon-wrap {
      width: 44px; height: 44px; border-radius: 13px;
      background: #D0E8F8; border: 0.5px solid #A8C8E8;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; font-size: 22px;
    }
    .fish-text-main {
      font-size: 14px; font-weight: 500; color: #0C447C;
    }
    .fish-text-sub {
      font-size: 11px; color: #378ADD; margin-top: 3px;
    }

    .bottom-nav {
      display: flex; justify-content: space-around;
      border-top: 0.5px solid #C8E8E8; padding-top: 14px;
      margin-top: 20px;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center;
      gap: 3px; cursor: pointer; padding: 4px 16px;
      border-radius: 12px; transition: background 0.2s;
    }
    .nav-item:hover { background: #E0F4F4; }
    .nav-item:active { transform: scale(0.95); }
    .nav-icon { font-size: 22px; color: #A8D8D8; }
    .nav-icon.on { color: #2E8B8A; }
    .nav-lbl { font-size: 10px; color: #A8D8D8; }
    .nav-lbl.on { color: #2E8B8A; }
    .nav-dot {
      width: 4px; height: 4px; border-radius: 50%;
      background: #5BBFBE;
    }

    /* 토스트 메시지 */
    .toast {
      position: fixed; bottom: 80px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1A3A3A; color: #fff;
      padding: 10px 20px; border-radius: 20px;
      font-size: 13px; opacity: 0;
      transition: all 0.3s; pointer-events: none;
      white-space: nowrap; z-index: 999;
    }
    .toast.show {
      opacity: 1; transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

<div class="phone">
  <div class="statusbar">
    <span id="current-time">9:41</span>
    <span style="letter-spacing:3px;">●●●</span>
  </div>

  <div class="toprow">
    <div>
      <div class="greet-sub" id="greet-sub">GOOD EVENING</div>
      <div class="greet-main" id="greet-main">오늘 하루<br>어떠셨나요?</div>
    </div>
    <div class="notif-btn" onclick="showToast('알림이 없어요 😊')">
      <i class="ti ti-bell" style="font-size:20px;color:#5BBFBE;"></i>
    </div>
  </div>

  <div class="mic-card" onclick="goToRecording()">
    <div class="mic-outer">
      <div class="mic-inner">
        <i class="ti ti-microphone" style="font-size:38px;color:#F0FAFA;"></i>
      </div>
    </div>
    <div class="mic-main-text">오늘의 목소리를 들려주세요</div>
    <div class="mic-sub-text">목소리로 감정을 분석해드려요</div>
    <div class="tap-hint">탭하여 시작 ↑</div>
  </div>

  <div class="aquarium-banner" onclick="goToAquarium()">
    <div class="fish-icon-wrap">🐟</div>
    <div style="flex:1;">
      <div class="fish-text-main">내 어항 보러가기</div>
      <div class="fish-text-sub">초록이 😊 · 노을이 😌 성장 중</div>
    </div>
    <i class="ti ti-chevron-right" style="font-size:18px;color:#A8C8E8;"></i>
  </div>

  <div class="bottom-nav">
    <div class="nav-item" onclick="setTab(0)" id="tab-0">
      <div class="nav-icon on"><i class="ti ti-home"></i></div>
      <div class="nav-lbl on">홈</div>
      <div class="nav-dot"></div>
    </div>
    <div class="nav-item" onclick="setTab(1)" id="tab-1">
      <div class="nav-icon"><i class="ti ti-chart-line"></i></div>
      <div class="nav-lbl">기록</div>
    </div>
    <div class="nav-item" onclick="setTab(2)" id="tab-2">
      <div class="nav-icon"><i class="ti ti-fish"></i></div>
      <div class="nav-lbl">어항</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // 현재 시간 표시
  function updateTime() {
    const now = new Date();
    const h = now.getHours().toString().padStart(2, '0');
    const m = now.getMinutes().toString().padStart(2, '0');
    document.getElementById('current-time').textContent = h + ':' + m;
  }
  updateTime();
  setInterval(updateTime, 1000);

  // 시간대별 인사말
  function updateGreeting() {
    const hour = new Date().getHours();
    const sub = document.getElementById('greet-sub');
    const main = document.getElementById('greet-main');
    if (hour >= 5 && hour < 12) {
      sub.textContent = 'GOOD MORNING';
      main.innerHTML = '좋은 아침이에요!<br>오늘 하루도 화이팅 :)';
    } else if (hour >= 12 && hour < 18) {
      sub.textContent = 'GOOD AFTERNOON';
      main.innerHTML = '오늘 오후는<br>어떠세요?';
    } else {
      sub.textContent = 'GOOD EVENING';
      main.innerHTML = '오늘 하루<br>어떠셨나요?';
    }
  }
  updateGreeting();

  // 탭 전환
  function setTab(index) {
    for (let i = 0; i < 3; i++) {
      const tab = document.getElementById('tab-' + i);
      const icon = tab.querySelector('.nav-icon');
      const lbl = tab.querySelector('.nav-lbl');
      const dot = tab.querySelector('.nav-dot');
      icon.classList.remove('on');
      lbl.classList.remove('on');
      if (dot) dot.remove();
    }
    const active = document.getElementById('tab-' + index);
    active.querySelector('.nav-icon').classList.add('on');
    active.querySelector('.nav-lbl').classList.add('on');
    const newDot = document.createElement('div');
    newDot.className = 'nav-dot';
    active.appendChild(newDot);

    if (index === 1) showToast('기록 화면으로 이동합니다');
    if (index === 2) goToAquarium();
  }

  // 토스트 메시지
  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  }

  // 녹음 화면으로 이동
  function goToRecording() {
    window.location.href = '02_recording.html';
  }

  // 어항 화면으로 이동
  function goToAquarium() {
    showToast('어항 화면으로 이동합니다 🐟');
  }
</script>
</body>
</html>
